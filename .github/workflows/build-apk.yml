name: Build & Release APK

on:
  push:
    branches:
      - main
      - claude/rename-auto-ecole-plus-1WAuL

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Java 17 (required by Android Gradle) ────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Node.js ─────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ── Install deps & build web ─────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # ── Capacitor sync ───────────────────────────────────────────
      - name: Sync Capacitor
        run: |
          [ -d "android" ] || npx cap add android
          npx cap sync android

      # ── Android SDK ──────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Generate app icon from logo (if needed) ──────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── Build debug APK ──────────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Get version for release tag ──────────────────────────────
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "name=Auto Ecole Plus v${VERSION}" >> $GITHUB_OUTPUT

      # ── Rename APK with version ──────────────────────────────────
      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             releases/AutoEcolePlus-v${VERSION}.apk

      # ── Commit APK to releases/ ──────────────────────────────────
      - name: Commit updated APK
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update APK release [${{ steps.version.outputs.tag }}]"
          file_pattern: releases/AutoEcolePlus-*.apk
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

      # ── Create GitHub Release ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body: |
            ## Auto Ecole Plus APK

            Automatic build from commit `${{ github.sha }}`

            ### Install
            Download `AutoEcolePlus-v${{ steps.version.outputs.tag }}.apk` and install on your Android device.
            You may need to enable **Install from unknown sources** in your settings.
          files: releases/AutoEcolePlus.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
